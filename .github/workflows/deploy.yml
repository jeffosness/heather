name: Deploy to IONOS

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Strip files that shouldn't hit the server. The SFTP account is scoped
      # to /heather/ and we push the whole tree there. IONOS serves from
      # /heather/public/ (subdomain docroot), so protected/ and includes/
      # end up outside the webroot automatically.
      - name: Prune non-deployable files
        run: |
          rm -rf .git .github tools README.md CLAUDE.md .gitignore
          ls -la

      - name: Deploy via SFTP
        uses: wlixcc/SFTP-Deploy-Action@v1.2.4
        with:
          server: home98830486.1and1-data.host
          port: 22
          username: ${{ secrets.IONOS_SFTP_USERNAME }}
          password: ${{ secrets.IONOS_SFTP_PASSWORD }}
          local_path: "./"
          remote_path: "./"
          sftp_only: true
          delete_remote_files: false
